<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>UIUX</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='10' y='14' width='38' height='36' rx='6' fill='none' stroke='%2337352F' stroke-width='4.5'/><path d='M10 25H48' stroke='%2337352F' stroke-width='4.5'/><path d='M19 10V19M39 10V19' stroke='%2337352F' stroke-width='4.5' stroke-linecap='round'/><path d='M22 38L28 44L40 32' fill='none' stroke='%23C9938A' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chiron+Sung+HK&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --pink:#C9938A; --soft-pink:#E8C4BC; --light-pink:#F5E6E3;
  --blue:#7A9BAD; --soft-blue:#B8CFDA; --light-blue:#E3EDF3;
  --sage:#9AAE9B; --light-sage:#E8F0E8;
  --cream:#FAF3EE; --bg:#FAFAF8; --dark:#37352F; --medium:#5A5248; --gray:#9B9A97;
  --radius:18px;
  --shadow: 0 8px 24px rgba(201,147,138,.14);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Chiron Sung HK','Noto Sans TC', sans-serif; background:var(--bg); color:var(--dark); padding-bottom:30px; -webkit-font-smoothing:antialiased;}
button, input, select, textarea{font-family:inherit; font-size:1rem;}
button{cursor:pointer; border:none; background:none;}
.hidden{display:none !important;}

header.top{
  background:linear-gradient(135deg, var(--light-pink), var(--cream) 60%);
  padding:26px 20px 24px; border-bottom-left-radius:28px; border-bottom-right-radius:28px;
  position:relative; overflow:hidden; text-align:center;
}
header.top::after{content:""; position:absolute; right:-40px; top:-40px; width:150px; height:150px; border-radius:50%;
  background:radial-gradient(circle, var(--soft-pink) 0%, transparent 70%); opacity:.6;}
header.top h1{font-size:1.3rem; font-weight:900; position:relative; z-index:1;}
header.top .sub{font-size:.8rem; color:var(--medium); margin-top:4px; position:relative; z-index:1;}

main{max-width:600px; margin:0 auto; padding:18px 16px 30px;}

.promo-banner{margin:0 0 14px; background:var(--light-pink); color:var(--pink); font-size:.78rem; font-weight:700; text-align:center; padding:9px 12px; border-radius:12px;}

.rules-link{display:block; width:100%; text-align:center; font-size:.76rem; color:var(--gray); text-decoration:underline; text-underline-offset:2px; margin-bottom:12px;}
.rules-panel{background:var(--light-pink); border-radius:14px; padding:14px 16px; font-size:.78rem; color:var(--medium); line-height:1.8; margin-bottom:16px;}
.rules-panel ul{margin:0; padding-left:1.1em;}
.rules-panel .divider{border-top:1px dashed var(--soft-pink); margin:10px 0; padding-top:10px;}
.rules-panel .store-line{display:flex; gap:8px; margin-bottom:4px;}
.rules-panel .store-line b{flex-shrink:0; width:2.6em;}

/* ---- Progress steps ---- */
.steps{display:flex; justify-content:center; gap:6px; margin-bottom:20px;}
.step-dot{width:8px; height:8px; border-radius:50%; background:var(--light-pink);}
.step-dot.active{background:var(--pink); width:20px; border-radius:5px;}
.step-dot.done{background:var(--soft-pink);}

.card-section{background:#fff; border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); margin-bottom:16px;}
.card-section h2{font-size:1.02rem; font-weight:700; margin-bottom:14px;}
.back-link{font-size:.8rem; color:var(--medium); margin-bottom:10px; display:inline-block;}

/* ---- Staff picker ---- */
.staff-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.staff-pick{
  border:1.5px solid var(--light-pink); border-radius:16px; padding:16px 10px; text-align:center;
  background:#fff;
}
.staff-pick .dot{width:36px; height:36px; border-radius:50%; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900;}
.staff-pick b{font-size:.88rem; display:block;}
.staff-pick .hrs{font-size:.7rem; color:var(--gray); margin-top:2px; display:block;}

/* ---- Day strip ---- */
.day-strip{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:16px;}
.day-chip{min-width:56px; text-align:center; padding:9px 4px; border-radius:14px; background:#fff; border:1.5px solid var(--light-pink); font-weight:700; color:var(--medium); flex-shrink:0;}
.day-chip .dow{font-size:.66rem; display:block; color:var(--gray); font-weight:500;}
.day-chip .num{font-size:1.05rem; display:block; margin-top:2px;}
.day-chip.active{background:var(--pink); color:#fff; border-color:var(--pink);}
.day-chip.active .dow{color:#fce8e5;}

/* ---- Time slots ---- */
.slot-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.slot-btn{padding:12px 4px; border-radius:14px; border:1.5px solid var(--light-pink); background:#fff; font-weight:700; font-size:.88rem; color:var(--dark);}
.slot-btn:disabled{background:var(--bg); color:var(--gray); border-color:var(--bg); text-decoration:line-through; opacity:.6;}
.slot-btn.selected{background:var(--pink); color:#fff; border-color:var(--pink);}
.empty-msg{text-align:center; color:var(--gray); font-size:.85rem; padding:22px 10px;}

/* ---- 前置問卷 ---- */
.qa-block{margin-bottom:18px;}
.qa-block .ql{font-size:.86rem; font-weight:700; margin-bottom:8px;}
.opt-row{display:flex; flex-wrap:wrap; gap:8px;}
.opt-chip{padding:8px 16px; border-radius:20px; border:1.5px solid var(--light-pink); background:#fff; font-size:.82rem; color:var(--dark);}
.opt-chip.selected{background:var(--pink); border-color:var(--pink); color:#fff;}
.qa-text input{width:100%; border:1.5px solid var(--light-pink); border-radius:10px; padding:9px 12px; background:#fff;}

/* ---- 服務項目 ---- */
.svc-grid{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
.svc-chip{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-radius:14px; border:1.5px solid var(--light-pink); background:#fff; text-align:left; width:100%;}
.svc-chip .name{font-weight:700; font-size:.86rem;}
.svc-chip .dur{font-size:.7rem; color:var(--gray); margin-top:2px;}
.svc-chip .price{font-weight:700; font-size:.88rem; flex-shrink:0; margin-left:10px;}
.svc-chip.selected{background:var(--light-pink); border-color:var(--pink);}
.svc-chip.selected .price{color:var(--pink);}

/* ---- Form ---- */
.field{margin-bottom:14px;}
.field label{font-size:.8rem; font-weight:700; color:var(--medium); display:block; margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%; padding:11px 13px; border-radius:12px; border:1.5px solid var(--light-pink); background:#fff; color:var(--dark);}
.field textarea{resize:vertical; min-height:60px;}
.picked-summary{background:var(--light-pink); border-radius:14px; padding:12px 14px; font-size:.82rem; margin-bottom:16px; line-height:1.7;}
.btn-main{width:100%; background:var(--pink); color:#fff; font-weight:700; padding:14px; border-radius:16px; font-size:.95rem;}

.success-box{background:#fff; border-radius:var(--radius); padding:36px 24px; text-align:center; box-shadow:var(--shadow);}
.success-box .emoji{font-size:3rem; margin-bottom:12px;}
.success-box h2{font-size:1.15rem; font-weight:900; margin-bottom:8px;}
.success-box p{font-size:.85rem; color:var(--medium); line-height:1.6;}
.success-box .btn-main{margin-top:18px;}

.toast{position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--dark); color:#fff; padding:10px 18px;
  border-radius:20px; font-size:.85rem; font-weight:500; z-index:100; opacity:0; pointer-events:none; transition:opacity .25s;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<header class="top">
  <h1 id="salonName">線上預約</h1>
  <div class="sub" id="salonSub">選美容師 → 選日期 → 選時段，完成預約</div>
</header>

<main id="mainWrap">
  <div class="promo-banner hidden" id="promoBanner"></div>
  <button class="rules-link" id="rulesToggle">查看預約須知與門市資訊</button>
  <div class="rules-panel hidden" id="rulesPanel"></div>

  <div class="steps" id="stepsDots"></div>

  <!-- Step 1: 選美容師 -->
  <div class="card-section" id="stepStaff">
    <h2>第一步：選擇美容師</h2>
    <div class="staff-grid" id="staffGrid"></div>
  </div>

  <!-- Step 2: 選日期 -->
  <div class="card-section hidden" id="stepDate">
    <a class="back-link" onclick="goStep(1)">← 重選美容師</a>
    <h2>第二步：選擇日期</h2>
    <div class="day-strip" id="dayStrip"></div>
  </div>

  <!-- Step 3: 選時段 -->
  <div class="card-section hidden" id="stepTime">
    <a class="back-link" onclick="goStep(2)">← 重選日期</a>
    <h2>第三步：選擇時段</h2>
    <div class="slot-grid" id="slotGrid"></div>
  </div>

  <!-- Step 4: 前置問卷 -->
  <div class="card-section hidden" id="stepQuiz">
    <a class="back-link" onclick="goStep(3)">← 重選時段</a>
    <h2>第四步：預約前置表單</h2>
    <div id="quizWrap"></div>
    <button class="btn-main" onclick="goStep(5)">下一步：填寫資料</button>
  </div>

  <!-- Step 5: 填資料 -->
  <div class="card-section hidden" id="stepForm">
    <a class="back-link" id="backFromForm">← 上一步</a>
    <h2>第五步：填寫預約資料</h2>
    <div class="picked-summary" id="pickedSummary">--</div>
    <div class="field">
      <label>服務項目 *</label>
      <div class="svc-grid" id="svcGrid"></div>
    </div>
    <div class="field"><label>姓名 *</label><input type="text" id="cName" placeholder="您的姓名"></div>
    <div class="field"><label>電話 *</label><input type="tel" id="cPhone" placeholder="09xx-xxx-xxx"></div>
    <div class="field"><label>備註</label><textarea id="cNote" placeholder="有其他需求可以先告訴我們"></textarea></div>
    <button class="btn-main" onclick="submitBooking()">送出預約</button>
  </div>

  <div id="successBox" class="success-box hidden">
    <div class="emoji">🌸</div>
    <h2>預約已送出！</h2>
    <p id="successMsg">店家將於營業時間內確認您的預約，並以電話與您聯繫確認時段，謝謝您的預約。</p>
    <button class="btn-main" onclick="location.reload()">再預約一筆</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAJH9aiE85y9SO3w7WBcGNE2mBWfs1hiYg",
  authDomain: "booking20-c9a67.firebaseapp.com",
  projectId: "booking20-c9a67",
  storageBucket: "booking20-c9a67.firebasestorage.app",
  messagingSenderId: "371446799734",
  appId: "1:371446799734:web:12bf397103a666d2492e57"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const params = new URLSearchParams(location.search);
const salonId = params.get('salon');

let salonSettings = { name:'預約系統', bizStart:9, bizEnd:20 };
let staffList = [];
let busySlots = [];
let currentStep = 1;
let pickedStaff = null, pickedDate = null, pickedTime = null, pickedService = null;
let quizAnswers = {};
const SLOT_MIN = 30;

function pad(n){ return n.toString().padStart(2,'0'); }
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function el(tag, className, text){ const e=document.createElement(tag); if(className) e.className=className; if(text!==undefined) e.textContent=text; return e; }
function escapeHtml(str){ return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

if(!salonId){
  document.getElementById('mainWrap').innerHTML = '<div class="empty-msg">連結不正確，缺少店家資訊。請確認你使用的是店家提供的完整預約連結。</div>';
} else {
  init();
}

function init(){
  db.collection('salons').doc(salonId).get().then(doc=>{
    if(doc.exists){
      salonSettings = Object.assign(salonSettings, doc.data());
      document.getElementById('salonName').textContent = salonSettings.name || '線上預約';
      renderPromo();
      renderRulesPanel();
    } else {
      document.getElementById('mainWrap').innerHTML = '<div class="empty-msg">找不到這家店的預約資料。</div>';
    }
  });
  db.collection('salons').doc(salonId).collection('staff').onSnapshot(snap=>{
    staffList = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    staffList.sort((a,b)=>(a.order||0)-(b.order||0));
    renderStaffGrid();
  });
  db.collection('salons').doc(salonId).collection('busySlots').onSnapshot(snap=>{
    busySlots = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    if(currentStep===3) renderSlots();
  });
  renderStepsDots();
  document.getElementById('rulesToggle').onclick = ()=>{
    document.getElementById('rulesPanel').classList.toggle('hidden');
  };
}

/* ---- 優惠與須知 ---- */
function renderPromo(){
  const banner = document.getElementById('promoBanner');
  const text = (salonSettings.promoText||'').trim();
  if(!text){ banner.classList.add('hidden'); return; }
  banner.textContent = text;
  banner.classList.remove('hidden');
}
function renderRulesPanel(){
  const r = Object.assign({advanceDays:30, allowCancel:true, cancelHours:24, noShowLimit:3}, salonSettings.bookingRules||{});
  const st = Object.assign({address:'', phone:''}, salonSettings.storeInfo||{});
  let html = '<ul>';
  html += `<li>最早可提前 <b>${r.advanceDays} 天</b>預約</li>`;
  if(r.allowCancel) html += `<li>如需取消，請提前 <b>${r.cancelHours} 小時</b>告知，逾期未到將列入未到紀錄</li>`;
  else html += `<li>如需取消請致電店家處理</li>`;
  html += `<li>連續 <b>${r.noShowLimit} 次未到</b>，系統將暫停預約資格</li>`;
  html += '</ul>';
  if(st.address || st.phone || salonSettings.bizStart!=null){
    html += '<div class="divider">';
    if(st.address) html += `<div class="store-line"><b>地址</b><span>${escapeHtml(st.address)}</span></div>`;
    if(st.phone) html += `<div class="store-line"><b>電話</b><span>${escapeHtml(st.phone)}</span></div>`;
    if(salonSettings.bizStart!=null) html += `<div class="store-line"><b>時間</b><span>每日 ${salonSettings.bizStart}:00–${salonSettings.bizEnd}:00</span></div>`;
    html += '</div>';
  }
  document.getElementById('rulesPanel').innerHTML = html;
}

function renderStepsDots(){
  const wrap = document.getElementById('stepsDots');
  wrap.innerHTML='';
  const hasQuiz = (salonSettings.introForm||[]).length>0;
  const seq = hasQuiz ? [1,2,3,4,5] : [1,2,3,5];
  const pos = seq.indexOf(currentStep)+1;
  seq.forEach((_,i)=>{
    wrap.appendChild(el('div','step-dot' + (i+1===pos?' active':(i+1<pos?' done':''))));
  });
}

function goStep(n){
  currentStep = n;
  document.getElementById('stepStaff').classList.toggle('hidden', n!==1);
  document.getElementById('stepDate').classList.toggle('hidden', n!==2);
  document.getElementById('stepTime').classList.toggle('hidden', n!==3);
  document.getElementById('stepQuiz').classList.toggle('hidden', n!==4);
  document.getElementById('stepForm').classList.toggle('hidden', n!==5);
  renderStepsDots();
  if(n===2) renderDayStrip();
  if(n===3) renderSlots();
  if(n===4) renderQuiz();
  if(n===5) renderFormStep();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---- Step 1: 美容師 ---- */
function renderStaffGrid(){
  const wrap = document.getElementById('staffGrid');
  wrap.innerHTML='';
  if(staffList.length===0){ wrap.innerHTML = '<div class="empty-msg">目前店家還沒有設定可預約的美容師</div>'; return; }
  staffList.forEach(s=>{
    const card = el('div','staff-pick');
    card.innerHTML = `<div class="dot" style="background:${s.color||'#C9938A'}">${escapeHtml((s.name||'?')[0])}</div><b>${escapeHtml(s.name)}</b><span class="hrs">${s.workStart!=null?s.workStart+':00-'+s.workEnd+':00':''}</span>`;
    card.onclick = ()=>{ pickedStaff = s; goStep(2); };
    wrap.appendChild(card);
  });
}

/* ---- Step 2: 日期 ---- */
function renderDayStrip(){
  const wrap = document.getElementById('dayStrip');
  wrap.innerHTML='';
  const today = startOfDay(new Date());
  const dayNames = ['日','一','二','三','四','五','六'];
  const advanceDays = (salonSettings.bookingRules && salonSettings.bookingRules.advanceDays) || 30;
  const maxDays = Math.min(advanceDays, 60);
  for(let i=0;i<maxDays;i++){
    const d = addDays(today,i);
    const chip = el('div','day-chip'+(pickedDate && d.getTime()===pickedDate.getTime()?' active':''));
    chip.innerHTML = `<span class="dow">${i===0?'今天':'週'+dayNames[d.getDay()]}</span><span class="num">${d.getMonth()+1}/${d.getDate()}</span>`;
    chip.onclick = ()=>{ pickedDate = d; goStep(3); };
    wrap.appendChild(chip);
  }
}

/* ---- Step 3: 時段 ---- */
function renderSlots(){
  const wrap = document.getElementById('slotGrid');
  wrap.innerHTML='';
  if(!pickedStaff || !pickedDate) return;
  const startH = pickedStaff.workStart ?? salonSettings.bizStart ?? 9;
  const endH = pickedStaff.workEnd ?? salonSettings.bizEnd ?? 20;
  const now = new Date();
  const dayStart = new Date(pickedDate); const dayEnd = addDays(dayStart,1);
  const daySlots = busySlots.filter(b=>{
    const d = new Date(b.datetime);
    return b.staffId===pickedStaff.id && d>=dayStart && d<dayEnd;
  });

  let count = 0;
  for(let mins = startH*60; mins < endH*60; mins += SLOT_MIN){
    const slotDate = new Date(pickedDate);
    slotDate.setHours(0,0,0,0);
    slotDate.setMinutes(mins);
    const isPast = slotDate < now;
    const isBusy = isOverlapping(slotDate, 60, daySlots);
    const btn = el('button','slot-btn', `${pad(Math.floor(mins/60))}:${pad(mins%60)}`);
    if(isPast || isBusy){ btn.disabled = true; }
    else{
      btn.onclick = ()=>{
        pickedTime = slotDate;
        document.querySelectorAll('.slot-btn').forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected');
        const hasQuiz = (salonSettings.introForm||[]).length>0;
        setTimeout(()=>goStep(hasQuiz?4:5), 150);
      };
    }
    wrap.appendChild(btn);
    count++;
  }
  if(count===0){ wrap.innerHTML = '<div class="empty-msg">這天沒有可預約的時段</div>'; }
}
function isOverlapping(candidateStart, candidateDur, daySlots){
  const cStart = candidateStart.getTime();
  const cEnd = cStart + candidateDur*60000;
  return daySlots.some(b=>{
    const bStart = new Date(b.datetime).getTime();
    const bEnd = bStart + (b.duration||60)*60000;
    return cStart < bEnd && cEnd > bStart;
  });
}

/* ---- Step 4: 前置問卷 ---- */
function renderQuiz(){
  const wrap = document.getElementById('quizWrap');
  wrap.innerHTML='';
  const questions = salonSettings.introForm || [];
  questions.forEach((q,qi)=>{
    const block = el('div','qa-block');
    block.appendChild(el('div','ql', q.q));
    if(q.type==='text' || !(q.opts && q.opts.length)){
      const sub = el('div','qa-text');
      const input = document.createElement('input');
      input.value = quizAnswers[qi] || '';
      input.oninput = e=>{ quizAnswers[qi]=e.target.value; };
      sub.appendChild(input);
      block.appendChild(sub);
    } else {
      const row = el('div','opt-row');
      q.opts.forEach(opt=>{
        const chip = el('button','opt-chip'+(quizAnswers[qi]===opt?' selected':''), opt);
        chip.type='button';
        chip.onclick = ()=>{
          quizAnswers[qi]=opt;
          row.querySelectorAll('.opt-chip').forEach(c=>c.classList.remove('selected'));
          chip.classList.add('selected');
        };
        row.appendChild(chip);
      });
      block.appendChild(row);
    }
    wrap.appendChild(block);
  });
}

/* ---- Step 5: 服務 + 表單 ---- */
function renderFormStep(){
  const dow = ['日','一','二','三','四','五','六'][pickedTime.getDay()];
  document.getElementById('pickedSummary').innerHTML =
    `💇 ${escapeHtml(pickedStaff.name)}<br>📅 ${pickedTime.getMonth()+1}/${pickedTime.getDate()}（週${dow}） ${pad(pickedTime.getHours())}:${pad(pickedTime.getMinutes())}`;
  const hasQuiz = (salonSettings.introForm||[]).length>0;
  document.getElementById('backFromForm').textContent = hasQuiz ? '← 重填問卷' : '← 重選時段';
  document.getElementById('backFromForm').onclick = ()=> goStep(hasQuiz?4:3);
  renderSvcGrid();
}
function renderSvcGrid(){
  const wrap = document.getElementById('svcGrid');
  const services = salonSettings.services || [];
  if(services.length===0){
    wrap.innerHTML = '<div class="field"><input type="text" id="cServiceFree" placeholder="請輸入想預約的服務項目"></div>';
    pickedService = null;
    return;
  }
  wrap.innerHTML='';
  services.forEach((s,i)=>{
    const chip = el('button','svc-chip'+(pickedService===s?' selected':''));
    chip.type='button';
    const priceLabel = s.price ? '$'+s.price : '免費';
    chip.innerHTML = `<div><div class="name">${escapeHtml(s.name)}</div><div class="dur">約 ${s.duration||60} 分鐘</div></div><div class="price">${priceLabel}</div>`;
    chip.onclick = ()=>{ pickedService = s; renderSvcGrid(); };
    wrap.appendChild(chip);
  });
}
function submitBooking(){
  const name = document.getElementById('cName').value.trim();
  const phone = document.getElementById('cPhone').value.trim();
  const note = document.getElementById('cNote').value.trim();
  const services = salonSettings.services || [];
  let service, amount, duration;
  if(services.length===0){
    service = (document.getElementById('cServiceFree')||{}).value?.trim() || '';
    amount = 0; duration = 60;
  } else {
    if(!pickedService){ showToast('請選擇服務項目'); return; }
    service = pickedService.name; amount = pickedService.price||0; duration = pickedService.duration||60;
  }
  if(!name || !phone || !service){ showToast('請填寫姓名、電話與服務項目'); return; }

  const quizNote = (salonSettings.introForm||[]).map((q,i)=> quizAnswers[i] ? `${q.q}：${quizAnswers[i]}` : null).filter(Boolean).join('；');
  const fullNote = [quizNote, note].filter(Boolean).join('｜');

  const apptCol = db.collection('salons').doc(salonId).collection('appointments');
  const slotCol = db.collection('salons').doc(salonId).collection('busySlots');
  const apptRef = apptCol.doc();
  const slotRef = slotCol.doc(apptRef.id);
  const datetime = pickedTime.toISOString();

  const batch = db.batch();
  batch.set(apptRef, {
    name, phone, service, note: fullNote, staffId: pickedStaff.id, datetime, duration,
    amount, status: '待確認', createdAt: new Date().toISOString(), source: 'online'
  });
  batch.set(slotRef, { staffId: pickedStaff.id, datetime, duration });
  batch.commit().then(()=>{
    document.querySelectorAll('.card-section').forEach(s=>s.classList.add('hidden'));
    document.getElementById('stepsDots').classList.add('hidden');
    document.getElementById('promoBanner').classList.add('hidden');
    document.getElementById('rulesToggle').classList.add('hidden');
    document.getElementById('rulesPanel').classList.add('hidden');
    document.getElementById('successMsg').textContent =
      `${name}您好，已為您預約 ${pickedTime.getMonth()+1}/${pickedTime.getDate()} ${pad(pickedTime.getHours())}:${pad(pickedTime.getMinutes())}・${pickedStaff.name}・${service}。店家將於營業時間內確認您的預約，並以電話與您聯繫。`;
    document.getElementById('successBox').classList.remove('hidden');
  }).catch(err=>{
    showToast('預約失敗，請稍後再試：' + err.message);
  });
}
</script>
